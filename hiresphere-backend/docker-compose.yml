version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hiresphere_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiresphere}
      POSTGRES_USER: ${POSTGRES_USER:-hiresphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiresphere}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiresphere}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hiresphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hiresphere_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery_worker:
    build:
      context: ./backend
    container_name: hiresphere_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info

  celery_beat:
    build:
      context: ./backend
    container_name: hiresphere_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A config beat -l info

volumes:
  postgres_data:
  static_volume:
  media_volume:
